appId: com.suthiwat.zeta
productName: Zeta
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack: []
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Zeta
