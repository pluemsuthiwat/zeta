appId: com.suthiwat.zeta
productName: Zeta
copyright: Copyright © 2026 Suthiwat Srisen
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack: []
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  # arch in every name: an x64 dmg installed on Apple silicon runs under Rosetta and feels sluggish
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Sign with the Developer ID so Gatekeeper opens the app without warnings. Named explicitly: on a
  # machine without this certificate the build fails instead of shipping an unsigned app, which
  # macOS never matches to the Local Network permission (EHOSTUNREACH to the controller).
  identity: Suthiwat Srisen (FHJV635JGF)
  hardenedRuntime: true # required for notarization; Electron's entitlements come from electron-builder's default
  # Needs APPLE_KEYCHAIN + APPLE_KEYCHAIN_PROFILE (see README, Releasing)
  notarize: true
  extendInfo:
    NSLocalNetworkUsageDescription: Zeta connects to Aruba controllers on your local network to provision access points.
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Zeta
